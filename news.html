<script>
    // Theme toggle
    function toggleTheme() {
        var html = document.documentElement;
        var current = html.getAttribute('data-theme');
        if (current === 'dark') {
            html.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
        } else {
            html.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeIcon();
    }
    function updateThemeIcon() {
        var btn = document.getElementById('themeToggle');
        if (btn) btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
    }
    updateThemeIcon();

    // Navbar scroll
    var navbar = document.getElementById('navbar');
    function handleScroll() {
        if (window.scrollY > 10) navbar.classList.add('scrolled');
        else navbar.classList.remove('scrolled');
    }
    window.addEventListener('scroll', handleScroll, { passive: true });

    // 新闻数据（每条对应一个独立文章页面，利于SEO收录）
    var newsData = [
        { title: "什么是API中转站？核心作用与底层原理一次性讲透", summary: "API中转站是介于开发者与AI模型厂商之间的中间代理平台，通过统一接口格式聚合、转发和封装各家大模型API，解决多模型接入、成本控制与网络访问等问题。", date: "2026-10-14", tag: "入门指南", url: "news/what-is-api-relay.html" },
        { title: "AI API中转站靠谱吗？风险识别与避坑要点全解析", summary: "API中转站市场鱼龙混杂，灰产风险极高。本文从法律合规、数据安全、资金风险三个维度，教你识别正规中转站并避开常见陷阱。", date: "2026-10-13", tag: "安全指南", url: "news/api-relay-safety.html" },
        { title: "2026年API中转站推荐：高性价比平台对比评测", summary: "精选10款主流AI API中转站，从模型覆盖、价格、稳定性、速度、客服五个维度横向对比，帮你找到最适合的中转服务。", date: "2026-10-12", tag: "推荐评测", url: "news/best-api-relay-2026.html" },
        { title: "GPT中转API怎么选？Claude与GPT中转方案对比", summary: "GPT中转API是开发者接入大模型的常用方案。本文对比Claude中转、GPT中转在价格、速度、可用性上的差异，并给出选型建议。", date: "2026-10-11", tag: "选购指南", url: "news/gpt-claude-relay-compare.html" },
        { title: "API中转站常见报错排查：超时、401、速率限制解决办法", summary: "AI中转站常见报错集中在超时、401未授权、速率限制三方面。本文逐一分析原因并给出排查步骤和解决方案。", date: "2026-10-10", tag: "技术排查", url: "news/api-relay-error-fix.html" },
        { title: "自建API中转站教程：用New API搭建统一模型网关", summary: "自建AI中转站推荐使用New API（One API升级版），一条Docker命令即可把DeepSeek、GPT、Claude等模型统一成OpenAI标准格式。", date: "2026-10-09", tag: "自建教程", url: "news/self-host-api-relay.html" },
        { title: "API中转站价格对比：按量付费与套餐订阅哪个更划算", summary: "中转站计费模式分按量付费和套餐订阅两种。本文通过实际使用场景计算，分析不同用量下哪种模式更省钱。", date: "2026-10-08", tag: "价格分析", url: "news/api-relay-pricing.html" },
        { title: "API中转站接口限流与日志监控配置实操指南", summary: "针对API中转站的限流与日志监控，核心思路是根据业务场景选择限流维度与算法，日志监控兼顾调试便利性与存储成本。", date: "2026-10-07", tag: "运维实操", url: "news/api-relay-rate-limit.html" }
    ];

    var PAGE_SIZE = 10;
    var currentPage = 1;

    function renderNews() {
        var list = document.getElementById('newsList');
        var start = (currentPage - 1) * PAGE_SIZE;
        var end = start + PAGE_SIZE;
        var pageItems = newsData.slice(start, end);

        list.innerHTML = pageItems.map(function(item) {
            return '<a class="news-card" href="' + item.url + '">' +
                '<div class="news-card-meta">' +
                    '<span class="news-tag">' + item.tag + '</span>' +
                    '<span>' + item.date + '</span>' +
                '</div>' +
                '<h2>' + item.title + '</h2>' +
                '<p>' + item.summary + '</p>' +
            '</a>';
        }).join('');

        renderPagination();
    }

    function renderPagination() {
        var totalPages = Math.ceil(newsData.length / PAGE_SIZE);
        var pag = document.getElementById('pagination');
        if (totalPages <= 1) { pag.innerHTML = ''; return; }

        var html = '';
        if (currentPage > 1) {
            html += '<a onclick="goPage(' + (currentPage - 1) + ')">上一页</a>';
        }
        for (var i = 1; i <= totalPages; i++) {
            html += (i === currentPage)
                ? '<span class="active">' + i + '</span>'
                : '<a onclick="goPage(' + i + ')">' + i + '</a>';
        }
        if (currentPage < totalPages) {
            html += '<a onclick="goPage(' + (currentPage + 1) + ')">下一页</a>';
        }
        pag.innerHTML = html;
    }

    function goPage(p) {
        currentPage = p;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderNews();
</script>
