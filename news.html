function renderNews() {
    var grid = document.getElementById('newsGrid');
    grid.innerHTML = articles.map(function(a, i) {
        return '<div class="news-card" onclick="openArticle(' + i + ')">' +
            '<span class="news-tag ' + a.tag + '">' + a.tagText + '</span>' +
            '<h2>' + a.title + '</h2>' +
            '<div class="news-date">' + a.date + '</div>' +
            '<div class="news-summary">' + a.summary + '</div>' +
            '<div class="news-read-more">阅读全文 →</div>' +
            '</div>';
    }).join('');
}

function openArticle(idx) {
    var a = articles[idx];
    document.getElementById('articleBody').innerHTML = a.content;
    document.getElementById('articleModal').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeArticle() {
    document.getElementById('articleModal').classList.remove('active');
    document.body.style.overflow = '';
}

function toggleTheme() {
    var current = document.documentElement.getAttribute('data-theme');
    var newTheme = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    document.getElementById('themeToggle').textContent = newTheme === 'dark' ? '☀️' : '🌙';
}

function toggleMobileMenu() {
    document.getElementById('navLinks').classList.toggle('mobile-open');
}

renderNews();

(function() {
    var t = localStorage.getItem('theme') || 'light';
    var btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = t === 'dark' ? '☀️' : '🌙';
})();

document.getElementById('articleModal').addEventListener('click', function(e) {
    if (e.target === this) closeArticle();
});
</script>
