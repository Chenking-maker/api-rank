    var PAGE_SIZE = 6;
    var currentPage = 1;
    var currentTag = null;

    function getFiltered() {
        if (!currentTag) return newsData;
        return newsData.filter(function (n) { return n.tag === currentTag; });
    }

    function renderNews() {
        var list = document.getElementById('newsGrid');
        var items = getFiltered();
        var start = (currentPage - 1) * PAGE_SIZE;
        var pageItems = items.slice(start, start + PAGE_SIZE);

        list.innerHTML = pageItems.map(function (item) {
            return '<a class="news-card" href="' + item.url + '">' +
                '<div class="news-body">' +
                    '<div class="news-card-meta">' +
                        '<span class="news-tag">' + item.tag + '</span>' +
                        '<span>' + item.date + '</span>' +
                    '</div>' +
                    '<h2>' + item.title + '</h2>' +
                    '<p>' + item.summary + '</p>' +
                    '<span class="read-more">阅读全文 →</span>' +
                '</div>' +
            '</a>';
        }).join('');

        renderPagination(items.length);
        renderFilterBar();
    }

    function renderFilterBar() {
        var bar = document.getElementById('filterBar');
        var txt = document.getElementById('filterText');
        if (currentTag) {
            bar.classList.add('show');
            txt.innerHTML = '当前标签：<strong style="color:var(--accent)">' + currentTag + '</strong>';
        } else {
            bar.classList.remove('show');
        }
    }

    function renderPagination(total) {
        var totalPages = Math.ceil(total / PAGE_SIZE);
        var pag = document.getElementById('pagination');
        if (totalPages <= 1) { pag.innerHTML = ''; return; }

        var html = '';
        if (currentPage > 1) {
            html += '<a onclick="goPage(' + (currentPage - 1) + ')">上一页</a>';
        }
        for (var i = 1; i <= totalPages; i++) {
            html += (i === currentPage)
                ? '<span class="active">' + i + '</span>'
                : '<a onclick="goPage(' + i + ')">' + i + '</a>';
        }
        if (currentPage < totalPages) {
            html += '<a onclick="goPage(' + (currentPage + 1) + ')">下一页</a>';
        }
        pag.innerHTML = html;
    }

    function goPage(p) {
        currentPage = p;
        renderNews();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setTag(tag) {
        currentTag = (currentTag === tag) ? null : tag;
        currentPage = 1;
        renderNews();
        renderTagCloud();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function clearTag() {
        currentTag = null;
        currentPage = 1;
        renderNews();
        renderTagCloud();
    }

    // 右侧推荐
    function renderSidebar() {
        var side = document.getElementById('sideList');
        var feat = newsData.filter(function (n) { return n.featured; });
        side.innerHTML = feat.map(function (n) {
            return '<li><a href="' + n.url + '">' + n.title + '</a></li>';
        }).join('');

        renderTagCloud();
    }

    function renderTagCloud() {
        var cloud = document.getElementById('tagCloud');
        var seen = {};
        var tags = [];
        newsData.forEach(function (n) {
            if (!seen[n.tag]) { seen[n.tag] = 0; }
            seen[n.tag]++;
        });
        tags = Object.keys(seen);
        cloud.innerHTML = tags.map(function (t) {
            var cls = (t === currentTag) ? ' class="active"' : '';
            return '<a' + cls + ' onclick="setTag(\'' + t + '\')">' + t + '</a>';
        }).join('');
    }

    renderNews();
    renderSidebar();
</script>
