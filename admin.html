<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APIRank 商家后台 - 智能中转站推荐</title>
    <style>
        :root { --bg-primary: #0a0a0f; --bg-secondary: #12121a; --bg-card: #16161f; --accent: #6c5ce7; --accent-hover: #7c6ef7; --green: #00d2a0; --green-hover: #00e8b0; --text-primary: #e4e4e7; --text-secondary: #a1a1aa; --border: #27272a; --danger: #ef4444; --warning: #f59e0b; --radius: 12px; --radius-sm: 8px; --shadow: 0 4px 24px rgba(0,0,0,0.4); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; line-height: 1.6; }
        .login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-primary); }
        .login-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 48px 40px; width: 420px; max-width: 90vw; }
        .login-logo { text-align: center; margin-bottom: 32px; }
        .login-logo .logo-icon { width: 56px; height: 56px; background: linear-gradient(135deg, var(--accent), var(--green)); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 16px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px 16px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 14px; outline: none; }
        .login-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--accent), #5a4bd4); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; }
        .login-error { color: var(--danger); font-size: 13px; text-align: center; margin-top: 12px; }
        .dashboard { display: none; min-height: 100vh; }
        .dashboard.active { display: block; }
        .topbar { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar-logo { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent), var(--green)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: #fff; }
        .topbar-title { font-size: 16px; font-weight: 600; }
        .topbar-title span { color: var(--text-secondary); font-weight: 400; font-size: 13px; margin-left: 8px; }
        .topbar-right { display: flex; align-items: center; gap: 16px; }
        .logout-btn { padding: 6px 16px; background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 13px; cursor: pointer; }
        .main-content { padding: 32px; max-width: 1400px; margin: 0 auto; }
        .tab-nav { display: flex; gap: 8px; margin-bottom: 24px; }
        .tab-btn { padding: 10px 20px; background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 14px; cursor: pointer; }
        .tab-btn:hover { border-color: var(--accent); color: var(--text-primary); }
        .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .tab-btn .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; background: var(--danger); border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: 6px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .page-header { margin-bottom: 32px; }
        .page-header h2 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
        .page-header p { color: var(--text-secondary); font-size: 14px; }
        .workspace { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
        .input-panel, .results-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
        .panel-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
        .customer-textarea { width: 100%; min-height: 200px; padding: 16px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 14px; resize: vertical; outline: none; }
        .parse-actions { display: flex; gap: 12px; margin-top: 16px; }
        .btn-primary { flex: 1; padding: 12px 24px; background: linear-gradient(135deg, var(--accent), #5a4bd4); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-secondary { padding: 12px 20px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-secondary); font-size: 14px; cursor: pointer; }
        .example-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .example-chip { padding: 6px 12px; background: rgba(108,92,231,0.1); border: 1px solid rgba(108,92,231,0.2); border-radius: 20px; color: #a78bfa; font-size: 12px; cursor: pointer; }
        .results-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; color: var(--text-secondary); text-align: center; }
        .results-list { display: none; }
        .results-list.active { display: block; }
        .station-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 12px; }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .card-rank { width: 24px; height: 24px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; margin-right: 10px; }
        .rank-1 { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }
        .rank-2 { background: linear-gradient(135deg, #94a3b8, #64748b); color: #fff; }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #a0522d); color: #fff; }
        .card-name { font-size: 15px; font-weight: 600; flex: 1; }
        .card-score { font-size: 18px; font-weight: 700; color: var(--green); }
        .card-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .meta-item { font-size: 11px; padding: 2px 8px; background: rgba(255,255,255,0.05); border-radius: 4px; color: var(--text-secondary); }
        .card-features { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
        .feature-tag { font-size: 11px; padding: 2px 8px; background: rgba(108,92,231,0.1); border-radius: 4px; color: #a78bfa; }
        .btn-visit { padding: 8px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; color: var(--text-secondary); font-size: 12px; cursor: pointer; text-decoration: none; }
        .review-stats { display: flex; gap: 16px; margin-bottom: 32px; }
        .review-stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; flex: 1; text-align: center; }
        .stat-num { font-size: 32px; font-weight: 700; }
        .stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        .review-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
        .review-item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .review-item-name { font-size: 15px; font-weight: 600; }
        .review-item-time { font-size: 12px; color: var(--text-secondary); }
        .review-item-url { font-size: 13px; color: var(--accent); margin-bottom: 8px; }
        .review-item-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
        .review-item-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .review-meta-tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; }
        .review-meta-tag.model { background: rgba(108,92,231,0.15); color: #a78bfa; }
        .review-meta-tag.source { background: rgba(255,255,255,0.05); color: var(--text-secondary); }
        .review-actions { display: flex; gap: 8px; }
        .btn-approve { padding: 8px 16px; background: rgba(0,210,160,0.15); border: 1px solid rgba(0,210,160,0.3); border-radius: 6px; color: var(--green); font-size: 12px; cursor: pointer; }
        .btn-reject { padding: 8px 16px; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); border-radius: 6px; color: var(--danger); font-size: 12px; cursor: pointer; }
        .review-empty { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 24px; font-size: 14px; z-index: 9999; opacity: 0; transition: all 0.3s; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.success { border-color: var(--green); color: var(--green); }
        .toast.error { border-color: var(--danger); color: var(--danger); }
    </style>
</head>
<body>
    <div class="login-page" id="loginPage">
        <div class="login-box">
            <div class="login-logo">
                <div class="logo-icon">API</div>
                <h1>商家后台</h1>
            </div>
            <div class="form-group">
                <label>管理密码</label>
                <input type="password" id="passwordInput" placeholder="请输入密码">
            </div>
            <button class="login-btn" onclick="handleLogin()">登录</button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="topbar">
            <div class="topbar-left">
                <div class="topbar-logo">AR</div>
                <div class="topbar-title">工作台 <span>智能推荐引擎</span></div>
            </div>
            <div class="topbar-right">
                <button class="logout-btn" onclick="handleLogout()">退出登录</button>
            </div>
        </div>

        <div class="main-content">
            <div class="tab-nav">
                <button class="tab-btn active" onclick="switchTab('recommend')">智能推荐</button>
                <button class="tab-btn" onclick="switchTab('review')">提交审核 <span class="badge" id="reviewBadge">0</span></button>
            </div>

            <div class="tab-content active" id="tab-recommend">
                <div class="page-header">
                    <h2>客户需求智能解析</h2>
                    <p>粘贴客户发来的文字，系统自动识别需求并推荐最合适的中转站</p>
                </div>
                <div class="workspace">
                    <div class="input-panel">
                        <div class="panel-title">客户需求输入</div>
                        <textarea class="customer-textarea" id="customerText" placeholder="例如：我要用Claude写代码，预算100块，希望稳定"></textarea>
                        <div class="parse-actions">
                            <button class="btn-primary" onclick="handleParse()">智能解析</button>
                            <button class="btn-secondary" onclick="clearAll()">清空</button>
                        </div>
                        <div class="example-chips">
                            <button class="example-chip" onclick="fillExample(0)">Claude写代码</button>
                            <button class="example-chip" onclick="fillExample(1)">便宜GPT聊天</button>
                            <button class="example-chip" onclick="fillExample(2)">企业Gemini</button>
                        </div>
                    </div>
                    <div class="results-panel">
                        <div class="panel-title">推荐结果</div>
                        <div class="results-placeholder" id="resultsPlaceholder"><p>输入客户需求并点击「智能解析」</p></div>
                        <div class="results-list" id="resultsList"></div>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="tab-review">
                <div class="page-header">
                    <h2>站点提交审核</h2>
                    <p>审核用户提交的中转站，通过后将展示在首页推荐列表中</p>
                </div>
                <div class="review-stats">
                    <div class="review-stat-card"><div class="stat-num" id="statPending">0</div><div class="stat-label">待审核</div></div>
                    <div class="review-stat-card"><div class="stat-num" id="statApproved">0</div><div class="stat-label">已通过</div></div>
                    <div class="review-stat-card"><div class="stat-num" id="statRejected">0</div><div class="stat-label">已拒绝</div></div>
                </div>
                <div id="reviewList"></div>
            </div>
        </div>
    </div>

<script>
const stationDatabase = [
    { name: '诗云API', url: 'shiyunapi.com', models: ['claude','gpt','gemini'], price: 'low', special: ['cheap'], score: 9.8, stability: 9.5, speed: 9.0, support: 9.5, features: ['多模态','成本减半'], freeAmount: '新用户送额度' },
    { name: '4ksAPI', url: '4ksapi.com', models: ['claude','gpt','gemini'], price: 'medium', special: ['stable'], score: 9.5, stability: 9.8, speed: 9.2, support: 9.0, features: ['智能路由','企业级'], freeAmount: '无免费额度' },
    { name: '星链4SAPI', url: '4sapi.com', models: ['claude','gpt','gemini'], price: 'high', special: ['stable','fast'], score: 9.9, stability: 9.9, speed: 9.8, support: 9.5, features: ['企业级SLA'], freeAmount: '无免费额度' },
    { name: '硅基流动', url: 'siliconflow.cn', models: ['domestic'], price: 'low', special: ['fast','direct'], score: 8.8, stability: 9.0, speed: 9.5, support: 8.5, features: ['国产模型'], freeAmount: '每日免费额度' },
    { name: 'OpenRouter', url: 'openrouter.ai', models: ['claude','gpt','gemini'], price: 'medium', special: ['fast'], score: 8.5, stability: 8.5, speed: 9.0, support: 8.0, features: ['多模型聚合'], freeAmount: '新用户1美元免费' },
    { name: 'DeepSeek官方', url: 'platform.deepseek.com', models: ['domestic'], price: 'low', special: ['cheap','direct'], score: 9.0, stability: 9.5, speed: 9.5, support: 9.0, features: ['官方API','超低价'], freeAmount: '每月免费额度' }
];
const modelLabels = { claude: 'Claude', gpt: 'GPT', gemini: 'Gemini', domestic: '国产模型' };

function handleLogin() {
    const pwd = document.getElementById('passwordInput').value;
    if (pwd === 'apirank2026') {
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('dashboard').classList.add('active');
        loadCrawlerData();
    } else {
        document.getElementById('loginError').textContent = '密码错误';
    }
}

function handleLogout() {
    document.getElementById('dashboard').classList.remove('active');
    document.getElementById('loginPage').style.display = 'flex';
}

function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
    if (tabName === 'recommend') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-recommend').classList.add('active');
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-review').classList.add('active');
        renderReviewQueue();
    }
}

function getReviewQueue() { try { return JSON.parse(localStorage.getItem('reviewQueue') || '[]'); } catch(e) { return []; } }
function saveReviewQueue(queue) { localStorage.setItem('reviewQueue', JSON.stringify(queue)); }
function getApprovedSites() { try { return JSON.parse(localStorage.getItem('approvedSites') || '[]'); } catch(e) { return []; } }
function getReviewHistory() { try { return JSON.parse(localStorage.getItem('reviewHistory') || '[]'); } catch(e) { return []; } }

function updateReviewBadge() {
    const queue = getReviewQueue();
    const badge = document.getElementById('reviewBadge');
    if (queue.length > 0) { badge.textContent = queue.length; } else { badge.textContent = '0'; }
}

function updateReviewStats() {
    const queue = getReviewQueue();
    const approved = getApprovedSites();
    const history = getReviewHistory();
    document.getElementById('statPending').textContent = queue.length;
    document.getElementById('statApproved').textContent = approved.length;
    document.getElementById('statRejected').textContent = history.filter(h => h.action === 'rejected').length;
}

function renderReviewQueue() {
    const queue = getReviewQueue();
    const container = document.getElementById('reviewList');
    updateReviewStats();
    updateReviewBadge();
    if (queue.length === 0) {
        container.innerHTML = '<div class="review-empty"><p>暂无待审核的站点</p></div>';
        return;
    }
    let html = '';
    queue.forEach((item, idx) => {
        const sourceTag = item.source ? '<span class="review-meta-tag source">' + item.source + '</span>' : '';
        html += '<div class="review-item">' +
            '<div class="review-item-header"><span class="review-item-name">' + (item.name || '未命名') + '</span></div>' +
            (item.url ? '<div class="review-item-url">' + item.url + '</div>' : '') +
            '<div class="review-item-meta">' + sourceTag + '</div>' +
            '<div class="review-actions"><button class="btn-approve" onclick="approveSite(' + idx + ')">通过</button><button class="btn-reject" onclick="rejectSite(' + idx + ')">拒绝</button></div>' +
        '</div>';
    });
    container.innerHTML = html;
}

function approveSite(idx) {
    const queue = getReviewQueue();
    const site = queue[idx];
    const approved = getApprovedSites();
    approved.push(site);
    localStorage.setItem('approvedSites', JSON.stringify(approved));
    const history = getReviewHistory();
    history.push({ name: site.name, url: site.url, action: 'approved', actionTime: Date.now() });
    localStorage.setItem('reviewHistory', JSON.stringify(history));
    queue.splice(idx, 1);
    saveReviewQueue(queue);
    showToast('已通过: ' + (site.name || '未命名'), 'success');
    renderReviewQueue();
}

function rejectSite(idx) {
    const queue = getReviewQueue();
    const site = queue[idx];
    const history = getReviewHistory();
    history.push({ name: site.name, url: site.url, action: 'rejected', actionTime: Date.now() });
    localStorage.setItem('reviewHistory', JSON.stringify(history));
    queue.splice(idx, 1);
    saveReviewQueue(queue);
    showToast('已拒绝', 'error');
    renderReviewQueue();
}

function showToast(message, type) {
    const toast = document.createElement('div');
    toast.className = 'toast ' + (type || '');
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 2500);
}

function fillExample(idx) {
    const examples = ['我要用Claude写代码，预算100块', '帮我推荐一个便宜的GPT中转站，预算50', '企业用，需要Gemini，稳定性最重要'];
    document.getElementById('customerText').value = examples[idx] || '';
}

function clearAll() { document.getElementById('customerText').value = ''; document.getElementById('resultsList').classList.remove('active'); document.getElementById('resultsList').innerHTML = ''; document.getElementById('resultsPlaceholder').style.display = 'flex'; }

function handleParse() {
    const text = document.getElementById('customerText').value.trim();
    if (!text) return;
    const needs = parseCustomerText(text);
    const results = rankStations(needs);
    displayResults(results);
}

function parseCustomerText(text) {
    const models = [];
    if (/claude/i.test(text)) models.push('claude');
    if (/gpt|chatgpt/i.test(text)) models.push('gpt');
    if (/gemini/i.test(text)) models.push('gemini');
    if (/deepseek|国产/i.test(text)) models.push('domestic');
    if (models.length === 0) models.push('claude', 'gpt');
    return { models };
}

function rankStations(needs) {
    return stationDatabase.map(station => {
        let score = station.score;
        const modelMatch = needs.models.filter(m => station.models.includes(m)).length;
        score += (modelMatch / needs.models.length) * 3;
        return { ...station, matchedScore: Math.round(score * 10) / 10 };
    }).sort((a, b) => b.matchedScore - a.matchedScore).slice(0, 5);
}

function displayResults(results) {
    document.getElementById('resultsPlaceholder').style.display = 'none';
    const container = document.getElementById('resultsList');
    container.innerHTML = '';
    container.classList.add('active');
    results.forEach((station, idx) => {
        const modelTags = station.models.map(m => '<span class="meta-item">' + (modelLabels[m] || m) + '</span>').join('');
        const featureTags = station.features.map(f => '<span class="feature-tag">' + f + '</span>').join('');
        container.innerHTML += '<div class="station-card"><div class="card-header"><span class="card-rank rank-' + (idx+1) + '">' + (idx+1) + '</span><span class="card-name">' + station.name + '</span><span class="card-score">' + station.matchedScore + '</span></div><div class="card-meta">' + modelTags + '<span class="meta-item">' + station.url + '</span></div><div class="card-features">' + featureTags + '</div><div><a class="btn-visit" href="https://' + station.url + '" target="_blank">访问网站</a></div></div>';
    });
}

async function loadCrawlerData() {
    try {
        const res = await fetch('data/pending_stations.json');
        if (res.ok) {
            const pending = await res.json();
            const queue = getReviewQueue();
            let added = 0;
            pending.forEach(site => {
                if (!queue.some(q => q.url === site.url) && site.url && !site.url.includes('beian.cac.gov.cn') && !site.url.includes('.css')) {
                    queue.push({ name: site.name || site.domain, url: site.url, source: '爬虫', submitTime: Date.now() });
                    added++;
                }
            });
            saveReviewQueue(queue);
            if (added > 0) { updateReviewBadge(); updateReviewStats(); showToast('从爬虫加载了 ' + added + ' 个新站点', 'success'); }
        }
    } catch(e) {}
}

updateReviewBadge();
</script>
</body>
</html>
