<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APIRank 鍟嗗鍚庡彴 - 鏅鸿兘涓浆绔欐帹鑽?/title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #16161f;
            --accent: #6c5ce7;
            --accent-hover: #7c6ef7;
            --green: #00d2a0;
            --green-hover: #00e8b0;
            --text-primary: #e4e4e7;
            --text-secondary: #a1a1aa;
            --border: #27272a;
            --danger: #ef4444;
            --warning: #f59e0b;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* ========== LOGIN PAGE ========== */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        .login-page::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(108,92,231,0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 50%, rgba(0,210,160,0.05) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(3deg); }
        }

        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 40px;
            width: 420px;
            max-width: 90vw;
            position: relative;
            z-index: 1;
            box-shadow: var(--shadow);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--accent), var(--green));
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 16px;
        }

        .login-logo h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .login-logo p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108,92,231,0.15);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent), #5a4bd4);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            font-family: inherit;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-error {
            color: var(--danger);
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
        }

        /* ========== DASHBOARD ========== */
        .dashboard {
            display: none;
            min-height: 100vh;
        }

        .dashboard.active {
            display: block;
        }

        /* Top Bar */
        .topbar {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--green));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            color: #fff;
        }

        .topbar-title {
            font-size: 16px;
            font-weight: 600;
        }

        .topbar-title span {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 13px;
            margin-left: 8px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .topbar-time {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .logout-btn {
            padding: 6px 16px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .logout-btn:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        /* Main Content */
        .main-content {
            padding: 32px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-header h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Workspace Layout */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
        }

        /* Input Panel */
        .input-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title .icon {
            width: 28px;
            height: 28px;
            background: rgba(108,92,231,0.15);
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .customer-textarea {
            width: 100%;
            min-height: 200px;
            padding: 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            line-height: 1.7;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        .customer-textarea:focus {
            border-color: var(--accent);
        }

        .customer-textarea::placeholder {
            color: #52525b;
        }

        .parse-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .btn-primary {
            flex: 1;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent), #5a4bd4);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            padding: 12px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-secondary:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        /* Parsed Tags */
        .parsed-tags {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: none;
        }

        .parsed-tags.active {
            display: block;
        }

        .parsed-tags .tag-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .tag-model {
            background: rgba(108,92,231,0.15);
            color: #a78bfa;
        }

        .tag-budget {
            background: rgba(0,210,160,0.15);
            color: var(--green);
        }

        .tag-scene {
            background: rgba(245,158,11,0.15);
            color: var(--warning);
        }

        .tag-special {
            background: rgba(239,68,68,0.15);
            color: #f87171;
        }

        /* Results Panel */
        .results-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            min-height: 400px;
        }

        .results-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            color: var(--text-secondary);
            text-align: center;
        }

        .results-placeholder .placeholder-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .results-placeholder p {
            font-size: 14px;
        }

        .results-list {
            display: none;
        }

        .results-list.active {
            display: block;
        }

        /* Station Card */
        .station-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
            position: relative;
        }

        .station-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px rgba(108,92,231,0.2);
        }

        .station-card.first {
            border-color: var(--green);
            background: linear-gradient(135deg, rgba(0,210,160,0.05), var(--bg-secondary));
        }

        .station-card.first::before {
            content: 'BEST';
            position: absolute;
            top: -1px;
            right: 16px;
            background: var(--green);
            color: #000;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 0 0 6px 6px;
            letter-spacing: 0.5px;
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .card-rank {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .rank-1 { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; }
        .rank-2 { background: linear-gradient(135deg, #94a3b8, #64748b); color: #fff; }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #a0522d); color: #fff; }
        .rank-4, .rank-5 { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border); }

        .card-name {
            font-size: 15px;
            font-weight: 600;
            flex: 1;
        }

        .card-score {
            font-size: 18px;
            font-weight: 700;
            color: var(--green);
        }

        .card-score span {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .card-meta .meta-item {
            font-size: 11px;
            padding: 2px 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            color: var(--text-secondary);
        }

        .card-features {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px;
        }

        .card-features .feature-tag {
            font-size: 11px;
            padding: 2px 8px;
            background: rgba(108,92,231,0.1);
            border-radius: 4px;
            color: #a78bfa;
        }

        .card-actions {
            display: flex;
            gap: 8px;
        }

        .btn-report {
            flex: 1;
            padding: 8px 16px;
            background: rgba(0,210,160,0.1);
            border: 1px solid rgba(0,210,160,0.3);
            border-radius: 6px;
            color: var(--green);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-report:hover {
            background: rgba(0,210,160,0.2);
            border-color: var(--green);
        }

        .btn-visit {
            padding: 8px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            text-decoration: none;
        }

        .btn-visit:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        /* ========== MODAL ========== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 800px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 24px 64px rgba(0,0,0,0.5);
        }

        .modal::-webkit-scrollbar {
            width: 6px;
        }

        .modal::-webkit-scrollbar-track {
            background: transparent;
        }

        .modal::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .modal-header {
            padding: 24px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: var(--bg-card);
            z-index: 10;
            border-radius: 16px 16px 0 0;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 700;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .modal-body {
            padding: 28px;
        }

        /* Report Content */
        .report-section {
            margin-bottom: 28px;
        }

        .report-section:last-child {
            margin-bottom: 0;
        }

        .report-section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        /* Best Recommendation */
        .best-rec {
            background: linear-gradient(135deg, rgba(0,210,160,0.08), rgba(108,92,231,0.05));
            border: 1px solid rgba(0,210,160,0.3);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .best-rec-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--green), #00b890);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .best-rec-info h4 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .best-rec-info p {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .best-rec-score {
            margin-left: auto;
            text-align: center;
        }

        .best-rec-score .score-num {
            font-size: 32px;
            font-weight: 800;
            color: var(--green);
        }

        .best-rec-score .score-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Comparison Table */
        .compare-table {
            width: 100%;
            border-collapse: collapse;
        }

        .compare-table th,
        .compare-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .compare-table th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .compare-table tr:hover td {
            background: rgba(255,255,255,0.02);
        }

        .compare-table .station-name-col {
            font-weight: 600;
            color: var(--text-primary);
        }

        .compare-table .highlight {
            color: var(--green);
            font-weight: 600;
        }

        /* Bar Chart */
        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bar-label {
            width: 120px;
            font-size: 13px;
            color: var(--text-secondary);
            flex-shrink: 0;
            text-align: right;
        }

        .bar-track {
            flex: 1;
            height: 24px;
            background: var(--bg-secondary);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.6s ease;
            display: flex;
            align-items: center;
            padding-left: 8px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
        }

        .bar-fill.speed { background: linear-gradient(90deg, #6c5ce7, #a78bfa); }
        .bar-fill.price { background: linear-gradient(90deg, #00d2a0, #00e8b0); }
        .bar-fill.stability { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .bar-fill.support { background: linear-gradient(90deg, #3b82f6, #60a5fa); }

        .bar-value {
            width: 36px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        /* Free Amount Cards */
        .free-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .free-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px;
        }

        .free-card.has-free {
            border-color: rgba(0,210,160,0.3);
        }

        .free-card .free-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .free-card .free-amount {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .free-card .free-amount.has {
            color: var(--green);
        }

        /* Customer Need Summary */
        .need-summary {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 24px;
        }

        .need-summary h4 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .need-items {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .need-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .need-item .need-key {
            color: var(--text-secondary);
        }

        .need-item .need-val {
            color: var(--text-primary);
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .workspace {
                grid-template-columns: 1fr;
            }
            .main-content {
                padding: 20px;
            }
        }

        @media (max-width: 640px) {
            .topbar {
                padding: 0 16px;
            }
            .login-box {
                padding: 32px 24px;
            }
            .need-items {
                grid-template-columns: 1fr;
            }
        }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .station-card {
            animation: fadeInUp 0.4s ease forwards;
            opacity: 0;
        }

        .station-card:nth-child(1) { animation-delay: 0.05s; }
        .station-card:nth-child(2) { animation-delay: 0.1s; }
        .station-card:nth-child(3) { animation-delay: 0.15s; }
        .station-card:nth-child(4) { animation-delay: 0.2s; }

function parseCustomerText(text) {
    const lower = text.toLowerCase();

    // Models
    const models = [];
    if (/claude/i.test(text)) models.push('claude');
    if (/gpt|chatgpt/i.test(text)) models.push('gpt');
    if (/gemini/i.test(text)) models.push('gemini');
    if (/deepseek|璞嗗寘|閫氫箟|鏂囧績|鍥戒骇|kimi|鏅鸿氨|glm/i.test(text)) models.push('domestic');
    if (models.length === 0) models.push('claude', 'gpt'); // default

    // Budget
    const budgetMatch = text.match(/(\d+)\s*[鍧楀厓]|棰勭畻\s*(\d+)/);
    let budget = 'medium';
    if (budgetMatch) {
        const amount = parseInt(budgetMatch[1] || budgetMatch[2]) || 100;
        if (amount <= 50) budget = 'low';
        else if (amount <= 200) budget = 'medium';
        else budget = 'high';
    }
    if (/渚垮疁|浣庝环|鎬т环姣攟瓒?*瓒?*渚垮疁|鐪侀挶|鍏嶈垂/i.test(text)) budget = 'low';
    if (/棰勭畻鍏呰冻|涓嶉檺棰勭畻|璐?*娌″叧绯粅浼佷笟/i.test(text)) budget = 'high';

    // Scene
    const scenes = [];
    if (/鍐欎唬鐮亅缂栫▼|cursor|claude\s*code|copilot|寮€鍙?i.test(text)) scenes.push('coding');
    if (/鑱婂ぉ|鍐欎綔|瀵硅瘽|闂瓟/i.test(text)) scenes.push('chat');
    if (/浼佷笟|鍏徃|鍥㈤槦|鍟嗙敤/i.test(text)) scenes.push('enterprise');
    if (/api|鎺ュ彛|鎺ュ叆|璋冪敤|闆嗘垚/i.test(text)) scenes.push('api');
    if (/瀛︿範|瀛︾敓|鍏ラ棬|缁冧範/i.test(text)) scenes.push('learning');
    if (scenes.length === 0) scenes.push('coding', 'chat'); // default

    // Special
    const specials = [];
    if (/鍥藉唴|鐩磋繛|缈诲|鍏嶇炕|涓嶇敤缈?i.test(text)) specials.push('direct');
    if (/绋冲畾|鍙潬|涓嶆帀绾縷SLA/i.test(text)) specials.push('stable');
    if (/渚垮疁|浣庝环|鎬т环姣攟鐪侀挶/i.test(text)) specials.push('cheap');
    if (/蹇珅閫熷害|寤惰繜|鍝嶅簲/i.test(text)) specials.push('fast');

    return { models, budget, scenes, specials, originalText: text };
}

function rankStations(needs) {
    const scored = stationDatabase.map(station => {
        let score = station.score; // base score

        // Model match (critical)
        const modelMatch = needs.models.filter(m => station.models.includes(m)).length;
        const modelRatio = modelMatch / needs.models.length;
        score += modelRatio * 3; // up to +3

        // Budget match
        const priceMap = { low: 0, medium: 1, high: 2 };
        const budgetVal = priceMap[needs.budget];
        const stationPriceVal = priceMap[station.price];
        if (stationPriceVal <= budgetVal) {
            score += (budgetVal - stationPriceVal === 0) ? 1.5 : 1; // exact or cheaper
        } else {
            score -= 2; // over budget penalty
        }

        // Scene match
        const sceneMatch = needs.scenes.filter(s => station.scene.includes(s)).length;
        score += sceneMatch * 0.8;

        // Special match
        const specialMatch = needs.specials.filter(s => station.special.includes(s)).length;
        score += specialMatch * 1.2;

        // Bonus for free amount
        if (station.freeAmount.includes('鉁?)) score += 0.5;

        return { ...station, matchedScore: Math.round(score * 10) / 10 };
    });

    scored.sort((a, b) => b.matchedScore - a.matchedScore);
    return scored.slice(0, 5);
}

            '</div>' +
            '<span class="history-action-label ' + (isApproved ? 'approved' : 'rejected') + '">' +
                (isApproved ? '宸查€氳繃' : '宸叉嫆缁?) +
            '</span>' +
        '</div>';
    }

    historyList.innerHTML = html;
}

function approveSite(idx) {
    var queue = getReviewQueue();
    if (idx < 0 || idx >= queue.length) return;

    var site = queue[idx];
    var approvedSites = getApprovedSites();

    // Check for duplicate
    var exists = approvedSites.some(function(s) { return s.url === site.url && site.url; });
    if (exists) {
        showToast('璇ョ珯鐐瑰凡鍦ㄥ凡閫氳繃鍒楄〃涓?, 'warning');
        return;
    }

    // Add to approved sites
    site.approveTime = Date.now();
    approvedSites.push(site);
    saveApprovedSites(approvedSites);

    // Record history
    var history = getReviewHistory();
    history.push({
        name: site.name,
        url: site.url,
        action: 'approved',
        actionTime: Date.now()
    });
    saveReviewHistory(history);

    // Remove from queue
    queue.splice(idx, 1);
    saveReviewQueue(queue);

    showToast('宸查€氳繃: ' + (site.name || '鏈懡鍚嶇珯鐐?), 'success');
    renderReviewQueue();
}

function rejectSite(idx) {
    var queue = getReviewQueue();
    if (idx < 0 || idx >= queue.length) return;

    var site = queue[idx];

    // Record history
    var history = getReviewHistory();
    history.push({
        name: site.name,
        url: site.url,
        action: 'rejected',
        actionTime: Date.now()
    });
    saveReviewHistory(history);

    // Remove from queue
    queue.splice(idx, 1);
    saveReviewQueue(queue);

    showToast('宸叉嫆缁? ' + (site.name || '鏈懡鍚嶇珯鐐?), 'error');
    renderReviewQueue();
}

function deleteSite(idx) {
    var queue = getReviewQueue();
    if (idx < 0 || idx >= queue.length) return;

    var site = queue[idx];
    queue.splice(idx, 1);
    saveReviewQueue(queue);

    showToast('宸插垹闄? ' + (site.name || '鏈懡鍚嶇珯鐐?), 'warning');
    renderReviewQueue();
}

function showToast(message, type) {
    var existing = document.querySelector('.toast');
    if (existing) existing.remove();

    var toast = document.createElement('div');
    toast.className = 'toast ' + (type || '');
    toast.textContent = message;
    document.body.appendChild(toast);

    requestAnimationFrame(function() {
        toast.classList.add('show');
    });

    setTimeout(function() {
        toast.classList.remove('show');
        setTimeout(function() { toast.remove(); }, 300);
    }, 2500);
}

// Initialize badge on page load
updateReviewBadge();

// ========== CRAWLER DATA INTEGRATION ==========
// 从爬虫JSON文件加载数据
let crawlerPendingSites = [];
let crawlerActiveSites = [];
let crawlerDeadSites = [];

async function loadCrawlerData() {
    try {
        // 加载待审核站点
        const pendingRes = await fetch('data/pending_stations.json');
        if (pendingRes.ok) {
            crawlerPendingSites = await pendingRes.json();
        }
        
        // 加载活跃站点
        const activeRes = await fetch('data/stations.json');
        if (activeRes.ok) {
            crawlerActiveSites = await activeRes.json();
        }
        
        // 加载失效站点
        const deadRes = await fetch('data/dead_sites.json');
        if (deadRes.ok) {
            crawlerDeadSites = await deadRes.json();
        }
        
        // 合并到审核队列
        mergeCrawlerDataToReviewQueue();
        
        console.log('爬虫数据加载完成:', {
            pending: crawlerPendingSites.length,
            active: crawlerActiveSites.length,
            dead: crawlerDeadSites.length
        });
    } catch (e) {
        console.log('加载爬虫数据失败:', e);
    }
}

function mergeCrawlerDataToReviewQueue() {
    // 将爬虫发现的站点合并到审核队列
    const existingQueue = getReviewQueue();
    let addedCount = 0;
    
    crawlerPendingSites.forEach(site => {
        // 检查是否已存在
        const exists = existingQueue.some(q => q.url === site.url);
        if (!exists && site.url && !site.url.includes('beian.cac.gov.cn')) {
            existingQueue.push({
                name: site.name || site.domain,
                url: site.url,
                description: site.description || '',
                models: [],
                price: '',
                features: site.features || [],
                source: site.source || 'crawler',
                submitTime: new Date(site.discovered_at).getTime()
            });
            addedCount++;
        }
    });
    
    if (addedCount > 0) {
        saveReviewQueue(existingQueue);
        updateReviewBadge();
        updateReviewStats();
        showToast(`从爬虫加载了 ${addedCount} 个新站点`, 'success');
    }
}

// 页面加载时读取爬虫数据
loadCrawlerData();

// 定期刷新数据（每5分钟）
setInterval(loadCrawlerData, 5 * 60 * 1000);

</script>
