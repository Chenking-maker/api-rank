<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - API排行榜</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #f0f0f5; line-height: 1.6; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 0 24px; }
        
        .navbar { position: fixed; top: 0; left: 0; right: 0; padding: 16px 0; background: rgba(10,10,15,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.06); z-index: 100; }
        .navbar .container { display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #f0f0f5; }
        .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #6c5ce7, #a29bfe); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: white; }
        .logo-text { font-weight: 700; font-size: 18px; }
        .nav-links a { color: #8888a0; text-decoration: none; font-size: 14px; margin-left: 20px; }
        .nav-links a:hover { color: #a29bfe; }
        
        .page-header { padding: 120px 0 40px; }
        .page-header h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
        .page-header p { font-size: 14px; color: #8888a0; }
        
        .stats-bar { display: flex; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
        .stat-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 16px 24px; flex: 1; min-width: 120px; text-align: center; }
        .stat-number { font-size: 24px; font-weight: 800; font-family: 'JetBrains Mono', monospace; }
        .stat-number.green { color: #2ed573; }
        .stat-number.yellow { color: #ffc107; }
        .stat-number.red { color: #ff6b6b; }
        .stat-number.blue { color: #6c5ce7; }
        .stat-label { font-size: 12px; color: #8888a0; margin-top: 4px; }
        
        .admin-list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 80px; }
        .admin-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; display: flex; gap: 20px; align-items: flex-start; transition: all 0.2s; }
        .admin-item:hover { border-color: rgba(108,92,231,0.3); background: rgba(108,92,231,0.03); }
        .admin-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .admin-name { font-size: 18px; font-weight: 700; color: #fff; }
        .admin-url { font-size: 12px; color: rgba(255,255,255,0.4); word-break: break-all; }
        .admin-url a { color: #a29bfe; text-decoration: none; }
        .admin-url a:hover { text-decoration: underline; }
        .admin-desc { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 6px; }
        .admin-models, .admin-features { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; }
        .admin-scores { font-size: 11px; color: #a29bfe; margin-top: 6px; font-family: 'JetBrains Mono', monospace; background: rgba(108,92,231,0.08); padding: 8px 12px; border-radius: 8px; }
        .admin-meta { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 4px; }
        .admin-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; min-width: 100px; }
        .admin-status { font-size: 12px; padding: 4px 12px; border-radius: 12px; font-weight: 500; }
        .status-pass { color: #2ed573; background: rgba(46,213,115,0.1); }
        .status-fail { color: #ff6b6b; background: rgba(255,107,107,0.1); }
        .status-testing { color: #6c5ce7; background: rgba(108,92,231,0.1); }
        .status-pending { color: #ffc107; background: rgba(255,193,7,0.1); }
        .admin-btn { padding: 8px 16px; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; font-weight: 500; transition: all 0.2s; width: 100%; text-align: center; }
        .admin-btn.approve { background: rgba(46,213,115,0.12); color: #2ed573; }
        .admin-btn.approve:hover { background: rgba(46,213,115,0.25); }
        .admin-btn.reject { background: rgba(255,107,107,0.12); color: #ff6b6b; }
        .admin-btn.reject:hover { background: rgba(255,107,107,0.25); }
        .admin-btn.delete { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.5); }
        .admin-btn.delete:hover { background: rgba(255,107,107,0.15); color: #ff6b6b; }
        .admin-empty { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.3); font-size: 15px; }
        
        .footer { padding: 40px 0; border-top: 1px solid rgba(255,255,255,0.06); text-align: center; color: #555570; font-size: 13px; }
        
        @media (max-width: 768px) {
            .admin-item { flex-direction: column; }
            .admin-actions { flex-direction: row; align-items: center; width: 100%; }
            .admin-btn { flex: 1; }
            .stats-bar { gap: 8px; }
            .stat-item { padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <div class="logo-icon">A</div>
                <span class="logo-text">API<span>排行榜</span></span>
            </a>
            <div class="nav-links">
                <a href="index.html">返回首页</a>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <div class="page-header">
            <h1>⚙️ 后台管理</h1>
            <p>审核提交的站点，管理排行榜内容</p>
        </div>
        
        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <div class="stat-number blue" id="statTotal">0</div>
                <div class="stat-label">总提交</div>
            </div>
            <div class="stat-item">
                <div class="stat-number yellow" id="statPending">0</div>
                <div class="stat-label">待审核</div>
            </div>
            <div class="stat-item">
                <div class="stat-number green" id="statApproved">0</div>
                <div class="stat-label">已通过</div>
            </div>
            <div class="stat-item">
                <div class="stat-number red" id="statRejected">0</div>
                <div class="stat-label">已拒绝</div>
            </div>
        </div>
        
        <div id="adminList" class="admin-list">
            <div class="admin-empty">加载中...</div>
        </div>
    </div>
    
    <footer class="footer">
        <div class="container">API排行榜 - 后台管理（仅管理员可见）</div>
    </footer>

    <script>
        // 从 localStorage 读取审核队列
        function getQueue() {
            return JSON.parse(localStorage.getItem('reviewQueue') || '[]');
        }
        
        function saveQueue(queue) {
            localStorage.setItem('reviewQueue', JSON.stringify(queue));
        }
        
        // 渲染管理面板
        function renderAdminPanel() {
            const queue = getQueue();
            const container = document.getElementById('adminList');
            
            // 更新统计
            const pending = queue.filter(s => s.status === 'pending').length;
            const approved = queue.filter(s => s.status === 'approved').length;
            const rejected = queue.filter(s => s.status === 'rejected').length;
            document.getElementById('statTotal').textContent = queue.length;
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statApproved').textContent = approved;
            document.getElementById('statRejected').textContent = rejected;
            
            if (queue.length === 0) {
                container.innerHTML = '<div class="admin-empty">暂无提交记录<br><span style="font-size:12px;margin-top:8px;display:block;">用户在首页提交中转站后，记录会出现在这里</span></div>';
                return;
            }
            
            // 按时间倒序
            const sorted = [...queue].reverse();
            
            let html = '';
            sorted.forEach(function(site, reverseIdx) {
                const idx = queue.length - 1 - reverseIdx;
                const statusClass = site.status === 'approved' ? 'status-pass' : site.status === 'rejected' ? 'status-fail' : site.status === 'pending' ? 'status-pending' : 'status-testing';
                const statusText = site.status === 'approved' ? '已通过' : site.status === 'rejected' ? '已拒绝' : '待审核';
                const scoresHtml = site.scores ? 
                    '<div class="admin-scores">速度:' + site.scores.speed + ' | 模型:' + site.scores.models + ' | 价格:' + site.scores.price + ' | 稳定:' + site.scores.stability + ' | 口碑:' + site.scores.reputation + ' | 功能:' + site.scores.feature + ' | <b>总分:' + site.scores.total + '</b></div>' : '';
                
                html += '<div class="admin-item">' +
                    '<div class="admin-info">' +
                        '<div class="admin-name">' + site.name + '</div>' +
                        '<div class="admin-url"><a href="' + site.url + '" target="_blank">' + site.url + '</a></div>' +
                        (site.description ? '<div class="admin-desc">' + site.description + '</div>' : '') +
                        '<div class="admin-models">模型: ' + (site.models || []).join(', ') + '</div>' +
                        '<div class="admin-features">特点: ' + (site.features || []).join(', ') + '</div>' +
                        scoresHtml +
                        '<div class="admin-meta">响应: ' + (site.responseTime || '?') + 's | 总分: ' + (site.score || '?') + '/10 | 提交: ' + (site.submitTime ? new Date(site.submitTime).toLocaleString('zh-CN') : '未知') + '</div>' +
                    '</div>' +
                    '<div class="admin-actions">' +
                        '<span class="admin-status ' + statusClass + '">' + statusText + '</span>' +
                        (site.status !== 'approved' ? '<button class="admin-btn approve" onclick="approveSite(' + idx + ')">✅ 通过</button>' : '') +
                        (site.status !== 'rejected' ? '<button class="admin-btn reject" onclick="rejectSite(' + idx + ')">❌ 拒绝</button>' : '') +
                        '<button class="admin-btn delete" onclick="deleteSite(' + idx + ')">🗑️ 删除</button>' +
                    '</div>' +
                '</div>';
            });
            
            container.innerHTML = html;
        }
        
        // 审核通过
        function approveSite(index) {
            let queue = getQueue();
            if (index < 0 || index >= queue.length) return;
            
            const site = queue[index];
            site.status = 'approved';
            site.approvedTime = new Date().toISOString();
            queue[index] = site;
            saveQueue(queue);
            
            // 保存到已通过列表（供 index.html 读取）
            let approved = JSON.parse(localStorage.getItem('approvedSites') || '[]');
            if (!approved.find(s => s.name === site.name)) {
                approved.push(site);
                localStorage.setItem('approvedSites', JSON.stringify(approved));
            }
            
            renderAdminPanel();
        }
        
        // 拒绝
        function rejectSite(index) {
            let queue = getQueue();
            if (index < 0 || index >= queue.length) return;
            
            queue[index].status = 'rejected';
            saveQueue(queue);
            
            // 从已通过列表移除
            let approved = JSON.parse(localStorage.getItem('approvedSites') || '[]');
            approved = approved.filter(s => s.name !== queue[index].name);
            localStorage.setItem('approvedSites', JSON.stringify(approved));
            
            renderAdminPanel();
        }
        
        // 删除
        function deleteSite(index) {
            if (!confirm('确定要删除这条记录吗？')) return;
            
            let queue = getQueue();
            if (index < 0 || index >= queue.length) return;
            
            const site = queue[index];
            
            // 从已通过列表移除
            let approved = JSON.parse(localStorage.getItem('approvedSites') || '[]');
            approved = approved.filter(s => s.name !== site.name);
            localStorage.setItem('approvedSites', JSON.stringify(approved));
            
            // 从队列删除
            queue.splice(index, 1);
            saveQueue(queue);
            
            renderAdminPanel();
        }
        
        // 页面加载
        document.addEventListener('DOMContentLoaded', function() {
            renderAdminPanel();
        });
    </script>
</body>
</html>
