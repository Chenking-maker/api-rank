<script>
function toggleMobileMenu() {
    const navLinks = document.getElementById('navLinks');
    const menuBtn = document.querySelector('.mobile-menu-btn');
    const isOpen = navLinks.classList.toggle('mobile-open');
    menuBtn.classList.toggle('active');
    document.body.style.overflow = isOpen ? 'hidden' : '';
}

function closeMobileMenu() {
    const navLinks = document.getElementById('navLinks');
    const menuBtn = document.querySelector('.mobile-menu-btn');
    if (navLinks && navLinks.classList.contains('mobile-open')) {
        navLinks.classList.remove('mobile-open');
        if (menuBtn) menuBtn.classList.remove('active');
        document.body.style.overflow = '';
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const navLinks = document.getElementById('navLinks');
    if (navLinks) {
        navLinks.querySelectorAll('a').forEach(function(link) {
            link.addEventListener('click', function() {
                closeMobileMenu();
            });
        });
    }
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeMobileMenu();
    });
});

function openFinderModal() {
    alert('找适合自己的中转站功能正在开发中，请前往首页使用完整功能。');
}
function openSubmitModal() {
    alert('提交收录功能正在开发中，请前往首页使用完整功能。');
}

(async function() {
    const deadEl = document.getElementById('deadContent');
    const filteredEl = document.getElementById('filteredContent');

    // 加载失效站点
    try {
        const deadResp = await fetch('data/dead_sites.json');
        const deadSites = await deadResp.json();

        if (Array.isArray(deadSites) && deadSites.length > 0) {
            let html = '<p class="count">共 ' + deadSites.length + ' 个失效站点</p><ul class="dead-list">';
            deadSites.forEach(s => {
                const name = s.name || s.domain || '未知站点';
                const domain = s.domain || s.url ? s.url.replace(/^https?:\/\//, '').replace(/\/.*$/, '') : '';
                const reason = s.reason || s.status === 'dead' ? '无法访问' : '未知';
                html += '<li><span><span class="name">' + name + '</span><span class="domain">(' + domain + ')</span></span><span class="reason">' + reason + '</span></li>';
            });
            html += '</ul>';
            deadEl.innerHTML = html;
        } else {
            deadEl.innerHTML = '<p class="count">暂无失效站点 ✅</p>';
        }
    } catch(e) {
        deadEl.innerHTML = '<p class="count" style="color:#f0a500">加载失败，请稍后刷新</p>';
    }

    // 加载被过滤的站点（从 localStorage 的 filteredStations）
    try {
        const filtered = JSON.parse(localStorage.getItem('filteredStations') || '[]');
        if (filtered.length > 0) {
            let html = '<p class="count">共 ' + filtered.length + ' 个被过滤站点</p><ul class="filtered-list">';
            filtered.forEach(s => {
                const name = s.name || '未知';
                const reason = s.filterReason || '数据不完整';
                html += '<li><span class="name">' + name + '</span><span class="filter-reason">' + reason + '</span></li>';
            });
            html += '</ul>';
            filteredEl.innerHTML = html;
        } else {
            filteredEl.innerHTML = '<p class="count">暂无被过滤站点</p>';
        }
    } catch(e) {
        filteredEl.innerHTML = '<p class="count">暂无数据</p>';
    }

    // 显示更新时间
    try {
        const statusResp = await fetch('data/site_status.json');
        const status = await statusResp.json();
        if (status.updated_at) {
            const time = new Date(status.updated_at).toLocaleString('zh-CN');
            const timeEl = document.createElement('p');
            timeEl.className = 'update-time';
            timeEl.textContent = '最近更新：' + time + '（每日自动检测）';
            deadEl.appendChild(timeEl);
        }
    } catch(e) {}
})();
</script>
