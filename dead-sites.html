<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>已失效站点 - API排行榜</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
:root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-card: #16161f;
    --bg-card-hover: #1c1c28;
    --border: rgba(255,255,255,0.06);
    --border-hover: rgba(255,255,255,0.12);
    --text-primary: #f0f0f5;
    --text-secondary: #8888a0;
    --text-muted: #555570;
    --accent: #6c5ce7;
    --accent-light: #a29bfe;
    --accent-glow: rgba(108,92,231,0.3);
    --red: #ff6b6b;
    --green: #00d2d3;
    --yellow: #feca57;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
}

/* 导航栏 */
.nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,15,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
}
.nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
}
.nav-logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
}
.nav-logo .logo-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #a29bfe);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
}
.nav-links {
    display: flex;
    align-items: center;
    gap: 4px;
}
.nav-links a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 8px;
    transition: all 0.2s;
}
.nav-links a:hover { color: var(--text-primary); background: rgba(255,255,255,0.04); }
.nav-links a.active { color: var(--red); background: rgba(255,107,107,0.08); }

/* Hero */
.hero {
    padding: 60px 24px 40px;
    text-align: center;
    position: relative;
}
.hero::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 600px;
    height: 400px;
    background: radial-gradient(ellipse, rgba(255,107,107,0.06) 0%, transparent 70%);
    pointer-events: none;
}
.hero-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: rgba(255,107,107,0.1);
    border: 1px solid rgba(255,107,107,0.15);
    font-size: 24px;
    margin-bottom: 20px;
}
.hero h1 {
    font-size: 32px;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: 8px;
    letter-spacing: -0.5px;
}
.hero h1 span { color: var(--red); }
.hero .subtitle {
    font-size: 15px;
    color: var(--text-muted);
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.6;
}

/* 统计卡片 */
.stats-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 20px 24px;
    margin-bottom: 8px;
}
.stat-item {
    text-align: center;
}
.stat-item .stat-num {
    font-size: 28px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
}
.stat-item .stat-num.red { color: var(--red); }
.stat-item .stat-num.green { color: var(--green); }
.stat-item .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
}
.stat-divider {
    width: 1px;
    height: 36px;
    background: var(--border);
}

/* 内容区 */
.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 60px;
}

/* 站点列表 */
.section-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
}

.site-list {
    list-style: none;
}
.site-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 8px;
    transition: all 0.2s;
}
.site-list li:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
    transform: translateY(-1px);
}
.site-info {
    display: flex;
    align-items: center;
    gap: 14px;
}
.site-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,107,107,0.4);
    flex-shrink: 0;
}
.site-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-muted);
    text-decoration: line-through;
}
.site-domain {
    font-size: 12px;
    color: var(--text-muted);
    opacity: 0.5;
    margin-left: 6px;
    text-decoration: none;
}
.site-reason {
    font-size: 12px;
    color: rgba(255,107,107,0.6);
    background: rgba(255,107,107,0.06);
    padding: 4px 10px;
    border-radius: 8px;
    white-space: nowrap;
}

/* 恢复站点 */
.recovered-section {
    margin-top: 48px;
}
.recovered-section .section-label {
    color: var(--green);
}
.recovered-list {
    list-style: none;
}
.recovered-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: rgba(0,210,211,0.03);
    border: 1px solid rgba(0,210,211,0.08);
    border-radius: 14px;
    margin-bottom: 6px;
    transition: all 0.2s;
}
.recovered-list li:hover {
    background: rgba(0,210,211,0.06);
    border-color: rgba(0,210,211,0.12);
}
.recovered-info {
    display: flex;
    align-items: center;
    gap: 14px;
}
.recovered-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(0,210,211,0.5);
    flex-shrink: 0;
}
.recovered-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
}
.recovered-status {
    font-size: 12px;
    color: var(--green);
    background: rgba(0,210,211,0.08);
    padding: 4px 10px;
    border-radius: 8px;
}

/* 底部 */
.footer {
    text-align: center;
    padding: 32px 24px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 13px;
}
.footer a {
    color: var(--accent-light);
    text-decoration: none;
}
.footer a:hover { color: var(--accent); }

/* 空状态 */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-state .empty-text { font-size: 16px; }

/* 加载 */
.loading-state {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
    font-size: 14px;
}

/* 响应式 */
@media (max-width: 640px) {
    .hero h1 { font-size: 24px; }
    .stats-bar { gap: 20px; }
    .stat-item .stat-num { font-size: 22px; }
    .nav-links { display: none; }
    .site-list li { flex-direction: column; align-items: flex-start; gap: 8px; }
    .site-reason { align-self: flex-start; }
}
</style>
</head>
<body>

<!-- 导航栏 -->
<nav class="nav">
    <div class="nav-inner">
        <a href="index.html" class="nav-logo">
            <span class="logo-icon">🏆</span>
            API排行榜
        </a>
        <div class="nav-links">
            <a href="index.html">排行榜</a>
            <a href="dead-sites.html" class="active">失效站点</a>
        </div>
    </div>
</nav>

<!-- Hero -->
<div class="hero">
    <div class="hero-icon">⚠️</div>
    <h1>已失效<span>站点</span></h1>
    <p class="subtitle">以下站点无法访问或已停止服务，已从排行榜中隐藏。数据由每日自动检测更新。</p>
</div>

<!-- 统计 -->
<div class="stats-bar">
    <div class="stat-item">
        <div class="stat-num red" id="deadCount">-</div>
        <div class="stat-label">已失效</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat-item">
        <div class="stat-num green" id="recoveredCount">-</div>
        <div class="stat-label">已恢复</div>
    </div>
</div>

<!-- 失效站点列表 -->
<div class="container">
    <div class="section-label">失效站点</div>
    <ul class="site-list" id="deadList">
        <li class="loading-state">正在加载失效站点数据...</li>
    </ul>

    <div class="recovered-section" id="recoveredSection" style="display:none;">
        <div class="section-label">已恢复站点</div>
        <ul class="recovered-list" id="recoveredList"></ul>
    </div>
</div>

<!-- 底部 -->
<div class="footer">
    <p>数据由每日自动检测更新 · <a href="index.html">← 返回排行榜</a></p>
</div>

<script>
(async function() {
    const deadListEl = document.getElementById('deadList');
    const deadCountEl = document.getElementById('deadCount');
    const recoveredCountEl = document.getElementById('recoveredCount');
    const recoveredSectionEl = document.getElementById('recoveredSection');
    const recoveredListEl = document.getElementById('recoveredList');

    // 从 dead_sites.json 加载失效站点
    let deadSites = [];
    try {
        const resp = await fetch('data/dead_sites.json');
        if (resp.ok) deadSites = await resp.json();
    } catch(e) {}

    // 从 daily_check_cache.json 获取最新检测状态（可选，文件可能不存在）
    let cacheData = {};
    try {
        const resp = await fetch('data/daily_check_cache.json');
        if (resp.ok) cacheData = await resp.json();
    } catch(e) {
        console.log('daily_check_cache.json 不存在或加载失败，使用默认数据');
    }

    // 从 site_status.json 获取恢复站点（可选，文件可能不存在）
    let recoveredSites = [];
    let updatedAt = '';
    try {
        const resp = await fetch('data/site_status.json');
        if (resp.ok) {
            const status = await resp.json();
            if (status && Array.isArray(status.recovered)) recoveredSites = status.recovered;
            if (status && status.updated_at) updatedAt = status.updated_at.replace('T', ' ').substring(0, 19);
        }
    } catch(e) {
        console.log('site_status.json 不存在或加载失败');
    }

    // 从 localStorage 获取 admin 标记的恢复站点
    try {
        const adminRecovered = JSON.parse(localStorage.getItem('recoveredSites') || '[]');
        if (Array.isArray(adminRecovered) && adminRecovered.length > 0) {
            // 合并到 recoveredSites，去重
            const existingUrls = new Set(recoveredSites.map(s => s.url));
            adminRecovered.forEach(site => {
                if (site.url && !existingUrls.has(site.url)) {
                    recoveredSites.push(site);
                    existingUrls.add(site.url);
                }
            });
        }
    } catch(e) {
        console.log('从 localStorage 加载恢复站点失败');
    }

    // 交叉验证：过滤掉已恢复的
    const verifiedDead = deadSites.filter(site => {
        const domain = (site.domain || '').toLowerCase();
        if (cacheData[domain] && cacheData[domain].alive) return false;
        return true;
    });

    // 补充缓存中新失效的
    if (cacheData) {
        const deadDomains = new Set(verifiedDead.map(s => (s.domain || '').toLowerCase()));
        for (const [domain, info] of Object.entries(cacheData)) {
            if (!info.alive && !deadDomains.has(domain.toLowerCase())) {
                verifiedDead.push({
                    url: 'https://' + domain,
                    name: domain,
                    domain: domain,
                    reason: info.msg || '无法访问',
                    status: 'dead',
                    checked_at: info.date || ''
                });
            }
        }
    }

    // 渲染失效站点
    deadListEl.innerHTML = '';
    if (verifiedDead.length === 0) {
        deadListEl.innerHTML = '<div class="empty-state"><div class="empty-icon">🎉</div><div class="empty-text">暂无失效站点，所有站点运行正常！</div></div>';
    } else {
        verifiedDead.forEach(site => {
            const li = document.createElement('li');
            const info = document.createElement('div');
            info.className = 'site-info';
            const dot = document.createElement('span');
            dot.className = 'site-dot';
            const nameSpan = document.createElement('span');
            nameSpan.className = 'site-name';
            nameSpan.textContent = site.name || site.domain || site.url;
            const domainSpan = document.createElement('span');
            domainSpan.className = 'site-domain';
            domainSpan.textContent = site.domain || '';
            info.appendChild(dot);
            info.appendChild(nameSpan);
            info.appendChild(domainSpan);

            const reasonSpan = document.createElement('span');
            reasonSpan.className = 'site-reason';
            reasonSpan.textContent = site.reason || '无法访问';

            li.appendChild(info);
            li.appendChild(reasonSpan);
            deadListEl.appendChild(li);
        });
    }
    deadCountEl.textContent = verifiedDead.length;

    // 渲染恢复站点
    if (recoveredSites.length > 0) {
        recoveredSectionEl.style.display = 'block';
        recoveredSites.forEach(site => {
            const li = document.createElement('li');
            const info = document.createElement('div');
            info.className = 'recovered-info';
            const dot = document.createElement('span');
            dot.className = 'recovered-dot';
            const nameSpan = document.createElement('span');
            nameSpan.className = 'recovered-name';
            nameSpan.textContent = site.name || site.domain || site.url;
            info.appendChild(dot);
            info.appendChild(nameSpan);

            const statusSpan = document.createElement('span');
            statusSpan.className = 'recovered-status';
            statusSpan.textContent = '已恢复';

            li.appendChild(info);
            li.appendChild(statusSpan);
            recoveredListEl.appendChild(li);
        });
    }
    recoveredCountEl.textContent = recoveredSites.length;
})();
</script>
</body>
</html>
