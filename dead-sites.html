        :root {
            --bg-primary: #FAFAFA;
            --bg-secondary: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-card-hover: #F4F4F5;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }
        [data-theme="dark"] {
            --bg-primary: #09090B;
            --bg-secondary: #18181B;
            --bg-card: #18181B;
            --bg-card-hover: #27272A;
            --bg-hover: rgba(59, 130, 246, 0.12);
            --border: #27272A;
            --border-hover: #3F3F46;
            --text-primary: #FAFAFA;
            --text-secondary: #A1A1AA;
            --text-muted: #71717A;
            --accent: #60A5FA;
            --accent-light: #93C5FD;
            --accent-glow: rgba(96, 165, 250, 0.2);
            --accent-50: rgba(59,130,246,0.1);
            --accent-100: rgba(59,130,246,0.18);
            --red: #F87171;
            --red-50: rgba(239,68,68,0.1);
            --red-100: rgba(239,68,68,0.2);
            --orange: #FB923C;
            --yellow: #FBBF24;
            --green: #34D399;
            --purple: #A78BFA;
            --navbar-bg: rgba(9,9,11,0.72);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.5);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background 0.3s, color 0.3s;
            min-height: 100vh;
        }
        a { color: var(--accent); text-decoration: none; }

        /* ===== Navbar (和首页一致) ===== */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            background: var(--navbar-bg);
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
            transition: box-shadow 0.3s, border-color 0.3s;
        }
        .navbar.scrolled {
            box-shadow: var(--shadow-sm);
        }
        .navbar .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
        }
        .logo-text {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-primary);
        }
        .logo-text span { color: var(--accent); }

        .mobile-menu-btn {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px;
        }
        .mobile-menu-btn span {
            width: 22px;
            height: 2px;
            background: var(--text-primary);
            border-radius: 2px;
            transition: all 0.3s;
        }

        .nav-links {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .nav-links li {
            display: flex;
            align-items: center;
        }
        .nav-links a {
            color: var(--text-primary);
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        [data-theme="dark"] .nav-links a { color: var(--text-primary); }
        .nav-links a:hover { color: var(--accent); background: var(--bg-hover); text-decoration: none; }
        .nav-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--green);
            color: #fff;
            margin-left: 8px;
        }
        .theme-toggle {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            padding: 0;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
        }
        .github-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            transition: all 0.2s;
            padding: 0;
            flex-shrink: 0;
        }
        .github-link:hover {
            border-color: var(--accent);
        }
        .github-link svg {
            color: var(--text-primary);
        }

        /* ===== Main Content ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .page-header {
            padding: 60px 0 40px;
        }
        .page-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--red-50);
            border: 1px solid var(--red-100);
            color: var(--red);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
        }
        .page-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--red);
            border-radius: 50%;
        }
        .page-header h1 {
            font-size: clamp(28px, 4vw, 40px);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 12px;
        }
        .page-header .subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            max-width: 600px;
            line-height: 1.7;
        }
        .stats-bar {
            display: flex;
            gap: 32px;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .stat-item .num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px;
            font-weight: 700;
            color: var(--red);
        }
        .stat-item .label {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* ===== Dead List (两列) ===== */
        .dead-section {
            padding: 0 0 80px;
        }
        .dead-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 24px;
        }
        .dead-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            transition: all 0.2s;
            gap: 12px;
        }
        .dead-item:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
        }
        .dead-item .site-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            opacity: 0.65;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .dead-item .site-name:hover {
            opacity: 1;
            color: var(--accent);
        }
        .dead-item .site-name::after {
            content: '↗';
            font-size: 12px;
            opacity: 0.5;
            flex-shrink: 0;
        }
        .dead-item .reason {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-primary);
            padding: 3px 10px;
            border-radius: 9999px;
            border: 1px solid var(--border);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .tip-card {
            margin-top: 32px;
            padding: 16px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 32px;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: gap 0.2s;
        }
        .back-link:hover {
            gap: 10px;
        }

        /* ===== Mobile ===== */
        @media (max-width: 768px) {
            .navbar .container { padding: 0 16px; }
            .mobile-menu-btn { display: flex; }
            .nav-links {
                position: fixed;
                top: 60px;
                left: 0;
                right: 0;
                background: var(--bg-card);
                flex-direction: column;
                padding: 16px;
                gap: 4px;
                border-bottom: 1px solid var(--border);
                transform: translateY(-120%);
                transition: transform 0.3s ease;
            }
            .nav-links.open {
                transform: translateY(0);
            }
            .nav-links a {
                width: 100%;
                padding: 10px 14px;
            }
            .nav-badge { display: none; }

            .container { padding: 0 16px; }
            .page-header { padding: 40px 0 32px; }
            .stats-bar { gap: 20px; flex-wrap: wrap; }

            .dead-grid {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .dead-item { padding: 12px 14px; }
            .dead-item .site-name { font-size: 14px; }
            .dead-item .reason { font-size: 11px; padding: 3px 8px; }
        }
            .nav-links a.active{background:var(--bg-hover);color:var(--accent);font-weight:600}
    </style>
</head>

<div class="container">
    <header class="page-header">
        <div class="page-badge">已失效站点</div>
        <h1>已停止服务的中转站</h1>
        <p class="subtitle">以下站点无法访问或已停止服务，已从排行榜中移除。仅供参考和记录。</p>
        <div class="stats-bar">
            <div class="stat-item">
                <span class="num" id="deadCount">-</span>
                <span class="label">失效站点</span>
            </div>
            <div class="stat-item">
                <span class="num" style="color: var(--text-muted);">2026</span>
                <span class="label">记录年份</span>
            </div>
        </div>
    </header>

    <section class="dead-section">
        <div class="dead-grid" id="deadGrid">
            <div class="dead-loading" style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:48px 0;">正在加载失效站点数据...</div>
        </div>

        <div class="tip-card">
            点击站点名称可跳转至原网站（可能已无法访问）。如果你发现某个站点已恢复服务，欢迎反馈更新。
        </div>

        <a href="index.html" class="back-link">← 返回排行榜</a>
    </section>
</div>

<script>
    // Theme toggle (和首页一致)
    function toggleTheme() {
        var html = document.documentElement;
        var current = html.getAttribute('data-theme');
        if (current === 'dark') {
            html.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
        } else {
            html.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        }
        updateThemeIcon();
    }
    function updateThemeIcon() {
        var btn = document.getElementById('themeToggle');
        if (btn) {
            btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
        }
    }
    updateThemeIcon();

    // Mobile menu
    function toggleMobileMenu() {
        var nav = document.getElementById('navLinks');
        nav.classList.toggle('open');
    }

    // Navbar scroll effect
    var navbar = document.getElementById('navbar');
    function handleScroll() {
        if (window.scrollY > 10) {
            navbar.classList.add('scrolled');
        } else {
            navbar.classList.remove('scrolled');
        }
    }
    window.addEventListener('scroll', handleScroll, { passive: true });

    // 动态加载失效站点（与首页 index.html 使用相同数据源 dead_sites.json
    // 及 daily_check_cache.json 交叉验证逻辑，保证两处计数完全一致）
    (async function () {
        var grid = document.getElementById('deadGrid');
        var countEl = document.getElementById('deadCount');
        if (!grid) return;

        try {
            var results = await Promise.all([
                fetch('data/dead_sites.json').then(function (r) { return r.json(); }).catch(function () { return []; }),
                fetch('data/daily_check_cache.json').then(function (r) { return r.json(); }).catch(function () { return {}; })
            ]);
            var deadSites = results[0], cacheData = results[1];
            if (!Array.isArray(deadSites)) deadSites = [];
            if (!cacheData || typeof cacheData !== 'object') cacheData = {};

            // admin 标记恢复的站点（与首页一致，读取 localStorage）
            var recoveredFromAdmin = [];
            try { recoveredFromAdmin = JSON.parse(localStorage.getItem('recoveredSites') || '[]'); } catch (e) {}
            var recoveredDomains = {};
            recoveredFromAdmin.forEach(function (s) {
                var d = (s.domain || s.url || '').replace(/^https?:\/\//, '').replace(/\/$/, '').toLowerCase();
                if (d) recoveredDomains[d] = true;
            });

            // 过滤缓存中已恢复 / admin 标记恢复的站点
            var verifiedDead = deadSites.filter(function (site) {
                var domain = (site.domain || '').toLowerCase();
                if (cacheData[domain] && cacheData[domain].alive) return false;
                if (recoveredDomains[domain]) return false;
                return true;
            });

            // 补充：缓存中新失效但不在 dead_sites.json 中的站点
            var deadDomains = {};
            verifiedDead.forEach(function (s) { deadDomains[(s.domain || '').toLowerCase()] = true; });
            Object.keys(cacheData).forEach(function (domain) {
                var info = cacheData[domain];
                if (!info.alive && !deadDomains[domain.toLowerCase()]) {
                    verifiedDead.push({
                        url: 'https://' + domain, name: domain, domain: domain,
                        reason: info.msg || '无法访问', status: 'dead'
                    });
                }
            });

            // 渲染
            grid.innerHTML = '';
            if (verifiedDead.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:48px 0;">暂无失效站点记录</div>';
            } else {
                verifiedDead.forEach(function (site) {
                    var name = site.name || site.domain || site.url;
                    var reason = site.reason || '无法访问';
                    var url = site.url || (site.domain ? 'https://' + site.domain : '#');
                    var item = document.createElement('div');
                    item.className = 'dead-item';
                    var a = document.createElement('a');
                    a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
                    a.className = 'site-name'; a.textContent = name;
                    var span = document.createElement('span');
                    span.className = 'reason'; span.textContent = reason;
                    item.appendChild(a); item.appendChild(span);
                    grid.appendChild(item);
                });
            }
            if (countEl) countEl.textContent = verifiedDead.length;
        } catch (e) {
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:48px 0;">失效站点数据加载失败</div>';
            if (countEl) countEl.textContent = '-';
        }
    })();

    // 点击菜单链接后自动关闭移动菜单
    document.querySelectorAll('#navLinks a').forEach(function(link) {
        link.addEventListener('click', function() {
            var nav = document.getElementById('navLinks');
            if (nav) nav.classList.remove('open');
        });
    });
</script>
